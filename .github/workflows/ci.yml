name: Laravel CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout (Obtener el código fuente)
      uses: actions/checkout@v4

    - name: Configurar entorno PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, bcmath, ctype, json, openssl, pdo, tokenizer, xml, curl
        coverage: none

    - name: 2. Preparación - Copiar configuración de entorno (.env)
      run: cp .env.example .env

    - name: Instalar dependencias de PHP con Composer
      run: composer install --prefer-dist --no-interaction --no-progress

    - name: Generar llave de seguridad de la aplicación
      run: php artisan key:generate

    - name: 3. Build - Instalar Node.js y compilar Frontend
      run: |
        npm install
        npm run buildas

    - name: 4. Test - Ejecutar pruebas automatizadas
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: ':memory:'
      run: php artisan test