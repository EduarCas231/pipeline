name: Laravel CD Deployment Pipeline

on:
  workflow_run:
    workflows: ["Laravel CD Release Pipeline"]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
    - name: 1. Descargar artefacto de liberación
      uses: actions/download-artifact@v4
      with:
        name: laravel-release-v1.0.0
        path: /tmp

    - name: 2. Simular transferencia y despliegue en servidor (SSH / Entorno de Pruebas)
      run: |
        echo "Simulando conexión SSH al servidor de pruebas..."
        echo "Transfiriendo archivo /tmp/release-v1.0.0.zip..."
        ls -la /tmp/release-v1.0.0.zip
        echo "Artefacto listo para el despliegue automatizado."