name: Laravel CD Release Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  laravel-release:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout del código fuente
      uses: actions/checkout@v4

    - name: 2. Configurar entorno PHP 8.2
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, bcmath, ctype, json, openssl, pdo, tokenizer, xml, curl, sqlite3
        coverage: none

    - name: 3. Preparar variables de entorno (.env)
      run: cp .env.example .env

    - name: 4. Instalar dependencias de producción (Composer)
      run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

    - name: 5. Generar App Key de Laravel
      run: php artisan key:generate

    - name: 6. Instalar Node.js y compilar Frontend (Vite)
      run: |
        npm ci || npm install
        npm run build

    - name: 7. Ejecutar pruebas automatizadas
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: ':memory:'
      run: php artisan test

    - name: 8. Limpieza de archivos sensibles antes del empaquetado
      run: |
        rm -f .env
        rm -rf storage/logs/*

    - name: 9. Generar archivo comprimido (Artefacto v1.0.0)
      run: |
        zip -r release-v1.0.0.zip . -x ".git/*" ".github/*" "tests/*" "node_modules/*" ".env*"

    - name: 10. Publicar Artefacto de Liberación en GitHub Actions
      uses: actions/upload-artifact@v4
      with:
        name: laravel-release-v1.0.0
        path: release-v1.0.0.zip
        retention-days: 7